# SPDX-License-Identifier: GPL-3.0-only
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android build components
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Enable ARM64 Linux builder emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Prepare pinned Android Linux runtime
        shell: bash
        run: ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358" tool/prepare-linux-runtime

      - name: Resolve workspace dependencies
        run: tool/flutterw pub get

      - name: Analyze, format-check, and test
        run: tool/check

      - name: Build Android ARM64 debug APK
        run: tool/build-apk

      # Source preview: verify the build without distributing its bundled Linux
      # binaries. Enable public APK delivery only together with the complete
      # corresponding-source bundle described in docs/LINUX_RUNTIME_SOURCES.md.
