name: perant_workspace
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
workspace:
  - apps/perant
  - packages/perant_core
  - packages/perant_platform
  - packages/perant_gateway
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android: [cpu]
          linux: [cpu]
