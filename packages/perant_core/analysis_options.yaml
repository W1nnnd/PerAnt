analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - discarded_futures
    - hash_and_equals
    - prefer_final_fields
    - unnecessary_lambdas
